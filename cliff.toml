# git-cliff configuration for Universal Numbers Library
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to the Universal Numbers Library will be documented in this file.

This changelog is automatically generated from [Conventional Commits](https://www.conventionalcommits.org/).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/stillwater-sc/universal
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{# Behaviour changes: collected from a BEHAVIOUR-CHANGE (or BEHAVIOR-CHANGE)
   commit trailer, so a user-visible change in results reaches the release page
   instead of living only in the annotated tag. The generated notes are built
   from commit subjects, which cannot express "this changes what your code
   returns". Both spellings are accepted. #}
{%- set_global has_behaviour_change = false -%}
{%- for commit in commits -%}
  {%- for f in commit.footers -%}
    {%- if f.token == "BEHAVIOUR-CHANGE" or f.token == "BEHAVIOR-CHANGE" -%}
      {%- set_global has_behaviour_change = true -%}
    {%- endif -%}
  {%- endfor -%}
{%- endfor -%}
{%- if has_behaviour_change %}
### Behaviour changes
{% for commit in commits %}{%- for f in commit.footers %}{%- if f.token == "BEHAVIOUR-CHANGE" or f.token == "BEHAVIOR-CHANGE" %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ f.value }}{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}{%- endif %}{%- endfor %}{%- endfor %}
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{% if commit.breaking %}[**BREAKING**] {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif -%}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/stillwater-sc/universal" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    # Remove issue numbers from commit messages for grouping
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build System" },
    { message = "^ci", group = "CI/CD" },
    { message = "^style", group = "Styling" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore|^misc", group = "Miscellaneous" },
    # Skip merge commits
    { message = "^Merge", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "stillwater-sc"
repo = "universal"
