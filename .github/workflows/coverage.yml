name: Code Coverage

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  actions: write   # the job deletes its own superseded ccache generation before saving

env:
  # Force Node.js 24 for all JavaScript actions (eliminates Node.js 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coverage:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install lcov
        timeout-minutes: 15
        run: bash "$GITHUB_WORKSPACE/tools/scripts/ci-apt-install.sh" lcov

      # The instrumented Debug build of the whole CI tree took 13 minutes on every run.
      # ccache keeps the objects (and their .gcno notes) between runs; it saves on main
      # only, like the CMake workflow, and a PR restores main's newest generation.
      - name: Install and configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: coverage-gcc-debug
          max-size: "3G"
          save: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/restore-20min-cycle' }}   # TEMPORARY: measure a warm PR run; revert before merge

      - name: Configure with coverage flags
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUNIVERSAL_BUILD_CI=ON \
            -DUNIVERSAL_BUILD_LINEAR_ALGEBRA_BLAS=ON \
            -DUNIVERSAL_BUILD_LINEAR_ALGEBRA_DATA=ON \
            -DUNIVERSAL_BUILD_MIXEDPRECISION_POP=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      # In parallel: each test is its own executable with its own objects, so the .gcda
      # counters do not contend. Serially this step was 36 of the job's 52 minutes.
      - name: Run tests
        run: |
          echo "runner: $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB"
          ctest --test-dir build -j $(nproc) --output-on-failure
        continue-on-error: true  # Don't fail on test failures, still report coverage

      # Keep one ccache generation per artifact: delete the one this job restored, so
      # the save in the post step replaces it instead of stacking a second copy on top.
      - name: Drop the superseded ccache generation
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/ci-drop-ccache-generation.sh coverage-gcc-debug

      - name: Generate coverage info
        run: |
          # Capture coverage, ignoring errors from modern GCC coverage format
          lcov --capture --directory build --output-file coverage.info \
            --ignore-errors gcov,gcov \
            --ignore-errors negative,negative
          # Remove system headers, test files, and applications from coverage
          # Focus on include/sw/* which is the library code third parties rely on
          lcov --remove coverage.info \
            '/usr/*' \
            '*/test/*' \
            '*/static/*' \
            '*/elastic/*' \
            '*/applications/*' \
            '*/tools/*' \
            '*/education/*' \
            '*/playground/*' \
            '*/benchmark/*' \
            '*/blas/serialization/datafile.hpp' \
            --output-file coverage.info \
            --ignore-errors unused,unused
          lcov --list coverage.info --ignore-errors unused,unused || true

      # ADVISORY, NOT A GATE. Two separate things carry the name "coverage":
      #
      #   Coverage            this job. Required to pass -- it builds instrumented
      #                       and runs the suite.
      #   coverage/coveralls  a commit status posted by coveralls.io AFTER this
      #                       step uploads. Advisory only: it is not in the
      #                       branch-protection required list for main
      #                       (check-ascii, build, lint-pr-title).
      #
      # coveralls.io fails that status on ANY decrease, including -0.01%, and its
      # threshold is a coveralls.io repo setting rather than anything in this file
      # -- continue-on-error below governs this step, not the posted status.
      #
      # A red coverage/coveralls with this job green usually means nothing changed
      # about what is tested. Splitting a header into layers (see #1334) moves
      # lines between files, and the tool re-apportions them; two hundredths of a
      # percent against a gate that fires at one hundredth. Check the delta before
      # treating it as a finding.
      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true  # coveralls.io being unreachable must not fail the job
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.info
          format: lcov
