name: Sanitizers

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6 AM UTC
  # A push to main BUILDS but does not test: it keeps the ccache warm for the next PR.
  # The sanitizer tests still run on ready PRs, on the weekly schedule and on demand.
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  actions: write   # the job deletes its own superseded ccache generation before saving

env:
  # Force Node.js 24 for all JavaScript actions (eliminates Node.js 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sanitizers:
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    name: "${{ matrix.sanitizer }}${{ matrix.shard && format(' ({0})', matrix.shard) || '' }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: ASan
            artifact: sanitizer-asan-clang-debug
            cmake_flags: -DUNIVERSAL_ENABLE_ASAN=ON
            env_vars: ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          # UBSan at -O0 is the slowest suite: 85 minutes of test time, 24 at -j 4. It runs
          # as two shards that interleave the test numbers (ctest -I start,,2), which
          # spreads the heavy ereal/elreal tests across both. Both build from the same
          # cache; only the first saves it, so the two never race for one key.
          - sanitizer: UBSan
            shard: 1/2
            ctest_select: -I 1,,2
            artifact: sanitizer-ubsan-clang-debug
            cmake_flags: -DUNIVERSAL_ENABLE_UBSAN=ON
            env_vars: UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          - sanitizer: UBSan
            shard: 2/2
            ctest_select: -I 2,,2
            restore_only: true
            artifact: sanitizer-ubsan-clang-debug
            cmake_flags: -DUNIVERSAL_ENABLE_UBSAN=ON
            env_vars: UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Clang
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/tools/scripts/ci-apt-install.sh" clang

      # The instrumented Debug build took 17 (UBSan) to 24 (ASan) minutes on every run.
      # Saved on main only, like the CMake workflow; a PR restores main's newest generation.
      - name: Install and configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: ${{ matrix.artifact }}
          max-size: "3G"
          # Store this build's objects only; without it the cache grew to 3.0 / 3.0 GB
          evict-old-files: job
          save: ${{ !matrix.restore_only && (github.ref == 'refs/heads/main') }}

      # -gline-tables-only replaces Debug's -g: the sanitizers' stack traces still
      # symbolize to file:line, and the objects (and the ccache) shrink by about a quarter.
      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DUNIVERSAL_BUILD_CI=ON \
            -DCMAKE_C_FLAGS_DEBUG="-gline-tables-only" \
            -DCMAKE_CXX_FLAGS_DEBUG="-gline-tables-only" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_flags }}

      - name: Build
        if: github.event_name != 'push' || !matrix.restore_only
        run: cmake --build ${{github.workspace}}/build -j $(nproc)

      # Keep one ccache generation per artifact: delete the one this job restored, so
      # the save in the post step replaces it instead of stacking a second copy on top.
      - name: Drop the superseded ccache generation
        if: github.ref == 'refs/heads/main' && !matrix.restore_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/ci-drop-ccache-generation.sh ${{ matrix.artifact }}

      - name: Test
        if: github.event_name != 'push'
        working-directory: ${{github.workspace}}/build
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'ASan' && 'detect_leaks=0:halt_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizer == 'UBSan' && 'print_stacktrace=1:halt_on_error=1' || '' }}
        # One test per CPU. The public-repo ubuntu-latest runner has 4 vCPUs and 16 GB
        # (the -j 2 this replaces was sized for the old 2 vCPU / 7 GB runner), which
        # leaves ~4 GB per test under ASan's ~2-3x shadow-memory multiplier.
        # --timeout caps any hung instrumented test instead of CTest's 1500s default.
        # The slowest legitimate test, er_math_hyperbolic, runs ~197s solo under UBSan
        # -O0; 600s leaves room for it to share the machine with three others.
        run: |
          echo "runner: $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB"
          ctest -j $(nproc) --timeout 600 --output-on-failure ${{ matrix.ctest_select }}

      - name: Rerun failed tests
        if: failure() && github.event_name != 'push'
        working-directory: ${{github.workspace}}/build
        env:
          ASAN_OPTIONS: ${{ matrix.sanitizer == 'ASan' && 'detect_leaks=0:halt_on_error=1' || '' }}
          UBSAN_OPTIONS: ${{ matrix.sanitizer == 'UBSan' && 'print_stacktrace=1:halt_on_error=1' || '' }}
        run: ctest -j $(nproc) --timeout 600 --rerun-failed --output-on-failure ${{ matrix.ctest_select }}

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.sanitizer }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            ${{github.workspace}}/build/Testing
            ${{github.workspace}}/build/CMakeCache.txt
            ${{github.workspace}}/build/CMakeFiles/CMakeOutput.log
            ${{github.workspace}}/build/CMakeFiles/CMakeError.log
