name: CMake

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/FUNDING.yml'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.clang-format'
      - '.clang-tidy'
      - '.gitignore'
  # Manual re-trigger. A run can be lost without any commit being at fault -- the
  # 2026-08-26 Actions outage left the CMake and ASCII Guard runs for d63f3a84 queued
  # for hours, and GitHub then refused both cancel ("Cannot cancel a workflow run that
  # is completed") and rerun ("its workflow file may be broken") while dispatching new
  # runs on the same commit perfectly well. Without this trigger the only way to get CI
  # back onto main was an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # each job deletes its own superseded ccache generation before saving
  packages: read   # the cross jobs pull their toolchain image from ghcr.io (#1817)

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # Force Node.js 24 for all JavaScript actions (eliminates Node.js 20 deprecation warnings)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fast tier: Linux GCC + Clang with CI_LITE (~15 min)
  # Runs on every trigger including draft PRs
  fast:
    concurrency:
      group: cmake-fast-${{ matrix.artifact }}-${{ github.ref }}
      cancel-in-progress: true
    name: "${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (GCC) [fast]
            artifact: linux-x64-gcc-fast
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON -DUNIVERSAL_TEST_INSTALL=ON
          - name: Linux x64 (Clang) [fast]
            artifact: linux-x64-clang-fast
            compiler: clang
            cc: clang
            cxx: clang++
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON -DUNIVERSAL_TEST_INSTALL=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Clang
        if: matrix.compiler == 'clang'
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/tools/scripts/ci-apt-install.sh" clang

      - name: Install and configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: ${{ matrix.artifact }}
          # 2G, not 1G. A CI_LITE build is 474 objects and Universal's template-heavy
          # objects do not fit one build's worth into 1G: every run reported
          # "Cache size (GB): 1.0 / 1.0 (99.9%)", so ccache was LRU-evicting DURING the
          # build and throwing out objects before the next run could reuse them. Hit
          # rates sat at 4-6% on main and on every branch alike.
          max-size: "2G"
          # Save only on pushes to main: PR/branch runs restore the warm main cache but
          # do not create new ones. Without this every PR run saved a fresh cache and a
          # CI burst evicted the warm caches under GitHub's 10GB limit (#1009).
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Set ccache compiler launcher
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CMAKE_C_COMPILER_LAUNCHER || '' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CMAKE_CXX_COMPILER_LAUNCHER || '' }}
          ${{ matrix.cmake_flags }}
          ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0}', matrix.cc) || '' }}
          ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

      # One compile per vCPU: the hosted runners have 4 (3 on arm64 macOS, set in the
      # matrix). --parallel 2 dated from the 2-vCPU runners and halved every cold build.
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel ${{ matrix.build_jobs || 4 }}

      # Keep one ccache generation per artifact. ccache-action saves a NEW timestamped key
      # in its post step, and until the Prune workflow runs the old and new generations of
      # every artifact coexist. That doubling took the cache past its budget mid-run, so
      # the jobs that finish late -- the slow ones -- failed to save and stayed cold.
      # Deleting the generation this job restored lets the save replace it instead.
      - name: Drop the superseded ccache generation
        if: github.ref == 'refs/heads/main'
        shell: bash   # Git's bash on Windows, not WSL's
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/ci-drop-ccache-generation.sh ${{ matrix.artifact }}

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest -j 4 -C ${{env.BUILD_TYPE}} --output-on-failure

      - name: Rerun failed tests
        if: failure()
        run: |
          cd "${{github.workspace}}/build"
          ctest -C ${{env.BUILD_TYPE}} --rerun-failed --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.artifact }}
          path: |
            ${{github.workspace}}/build/Testing
            ${{github.workspace}}/build/CMakeCache.txt
            ${{github.workspace}}/build/CMakeFiles/CMakeOutput.log
            ${{github.workspace}}/build/CMakeFiles/CMakeError.log

  # Full tier: 11-platform matrix with full CI (~45 min)
  # Skipped for draft PRs and feature-branch pushes
  full:
    # workflow_dispatch is included so a manual run reproduces what a push to main
    # does. That is the point of the trigger: recovering a lost main run needs the full
    # matrix, not just the fast tier. Manual dispatch is deliberate and rare, so the
    # ~45min cost is the right default rather than something to opt into.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    concurrency:
      group: cmake-${{ matrix.artifact }}-${{ github.ref }}
      cancel-in-progress: true
    # The CMake configure and build commands are platform agnostic and work equally well on Windows or Mac.
    # Use a matrix build to enable cross-platform coverage.
    name: "${{ matrix.name }}"
    runs-on: "${{ matrix.os }}"
    # The cross jobs run in a prebuilt toolchain image (docker/ci-cross, published by
    # ci-images.yml), so they make no apt calls: installing the toolchains from the Ubuntu
    # mirrors on every run was their most common failure (#1817). An entry without
    # matrix.container has an empty image and runs on the runner itself.
    #
    # Inside a container ${{ github.workspace }} is still the RUNNER's path, which is not
    # mounted at that location; $GITHUB_WORKSPACE and relative paths are right in both, so
    # the steps below use those.
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full CI build on Linux (primary platforms)
          - os: ubuntu-latest
            name: Linux x64 (GCC)
            # -full, not bare: ccache-action restores by key PREFIX and takes the newest
            # match, so "linux-x64-gcc" also matched linux-x64-gcc-fast and the full job
            # restored the fast tier's cache (474 of its 912 objects, ~25-50% hits)
            artifact: linux-x64-gcc-full
            cmake_flags: -DUNIVERSAL_BUILD_CI=ON
          - os: ubuntu-latest
            name: Linux x64 (Clang)
            artifact: linux-x64-clang-full
            compiler: clang
            cc: clang
            cxx: clang++
            cmake_flags: -DUNIVERSAL_BUILD_CI=ON
          # Lite CI build on Windows and macOS (portability checks)
          - os: windows-latest
            name: Windows x64 (MSVC)
            artifact: windows-x64-msvc
            cmake_generator: Ninja
            # CI_LITE builds no efloat; add it here because its limb kernels have
            # MSVC-only paths (no __int128, _umul128, no inline asm)
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON -DUNIVERSAL_BUILD_NUMBER_EFLOATS=ON
          - os: macos-latest
            name: macOS ARM64 (Apple Clang)
            artifact: macos-arm64
            build_jobs: 3
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON
          - os: macos-15-intel
            name: macOS x64 (Apple Clang)
            artifact: macos-x64
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON
          # RISC-V cross-compilation with QEMU emulation
          - os: ubuntu-latest
            name: Linux RISC-V 64 (GCC cross)
            artifact: linux-riscv64-gcc
            cross: riscv64
            toolchain: cmake/toolchains/riscv64-linux-gnu.cmake
            # ci-images.yml builds whatever tag this names: bump the number when the
            # Dockerfile changes
            container: ghcr.io/stillwater-sc/universal-ci-cross:riscv64-2
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON
          # IBM POWER cross-compilation with QEMU emulation
          - os: ubuntu-latest
            name: Linux POWER 64 LE (GCC cross)
            artifact: linux-ppc64le-gcc
            cross: ppc64le
            toolchain: cmake/toolchains/ppc64le-linux-gnu.cmake
            container: ghcr.io/stillwater-sc/universal-ci-cross:ppc64le-2
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON
          # ARM64 on a NATIVE GitHub-hosted ARM64 runner (no QEMU). Compiling and
          # running the tests natively is both faster and higher fidelity than the
          # old QEMU-emulated cross job: cross-compilation ran natively but ctest
          # executed every test binary under qemu-user-static (~10-50x slower), which
          # dominated the job and which ccache cannot help. A native runner removes
          # the emulation entirely and lets ccache actually accelerate the build.
          - os: ubuntu-24.04-arm
            name: Linux ARM64 (GCC native)
            artifact: linux-aarch64-gcc
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON
          # Windows cross-compilation with MinGW-w64
          - os: ubuntu-latest
            name: Windows x64 (MinGW GCC cross)
            artifact: windows-x64-mingw
            cross: mingw
            toolchain: cmake/toolchains/x86_64-w64-mingw32.cmake
            container: ghcr.io/stillwater-sc/universal-ci-cross:mingw-2
            # efloat as for MSVC: runs the x86-64 inline-asm limb kernels under the
            # Windows x64 ABI (LLP64, 32-bit long), which no other job does
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON -DUNIVERSAL_BUILD_NUMBER_EFLOATS=ON
          # Android aarch64 cross-compilation (Clang, 128-bit long double)
          - os: ubuntu-latest
            name: Android ARM64 (NDK Clang cross)
            artifact: android-arm64-clang
            cross: android
            toolchain: cmake/toolchains/aarch64-linux-android.cmake
            cmake_flags: -DUNIVERSAL_BUILD_CI_LITE=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Clang
        if: matrix.compiler == 'clang'
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/tools/scripts/ci-apt-install.sh" clang

      - name: Install ARM64 cross-compiler and QEMU
        if: matrix.cross == 'aarch64'
        timeout-minutes: 15
        run: |
          bash "$GITHUB_WORKSPACE/tools/scripts/ci-apt-install.sh" g++-aarch64-linux-gnu qemu-user-static
          echo "QEMU_LD_PREFIX=/usr/aarch64-linux-gnu" >> $GITHUB_ENV

      # ccache for Linux and macOS, sccache for MSVC (#1843). On Windows the action runs
      # sccache over a local directory and saves it as ONE cache entry, like ccache's,
      # with the sccache version pinned by the action's own release. The job used to run
      # mozilla-actions/sccache-action with SCCACHE_GHA_ENABLED, which stores every object
      # as its own Actions cache entry: from at least 2026-10-19 nearly every one of those
      # writes failed ("create cache entry returns non-ok"), and that action installs the
      # LATEST sccache, so sccache v0.19.0 (2026-10-24) changed every hash key and left the
      # job at 0 hits with no way to refill.
      - name: Install and configure ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: ${{ matrix.artifact }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          # 2G everywhere. This is a CEILING, not an allocation: ccache stores only what
          # the build produces, so the CI_LITE configurations plateau around 1.0GB
          # internal (~0.84GB stored) and never approach it. Only the two full-CI Linux
          # jobs -- 912 objects against CI_LITE's 474 -- actually need the headroom, and
          # at 1G they sat pinned at "Cache size (GB): 1.0 / 1.0 (99.96%)", evicting
          # mid-build.
          max-size: "2G"
          # Save on every push to main again (#1009 still gates PR branches).
          #
          # #1408 restricted saving to four artifacts because 12 of them at ~0.8GB had
          # the repo at 9.94GB of a 10GB ceiling, and GitHub was evicting whole caches by
          # LRU. That was triage against a limit that no longer applies: the repository
          # cache limit is now 20GB. Projected steady state with everything saving is
          # 9 CI_LITE x ~0.84GB + 2 full-CI x ~1.6GB + ~0.4GB of sccache/node, about
          # 11.2GB -- comfortably inside 20GB, with the prune bounding generations.
          #
          # The eviction ceiling was never the operative limit. The spend budget is: on
          # 2026-09-22 it was reached and the cache went READ ONLY, so every save since
          # failed with "Cache reservation failed: You have reached your configured
          # budget". Restores kept working, so hits froze at whatever the 2026-09-22
          # generation held -- 296 objects -- while the denominator grew with each new
          # test, decaying 62% to 57% and pushing the fast tier from ~6 to ~16 minutes.
          # Watch the budget, not just the 20GB.
          #
          # So the seven platforms that #1408 left cold get their caches back: both
          # macOS, ARM64 native, POWER64, RISC-V, Android and MinGW.
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Set ccache compiler launcher
        if: runner.os != 'Windows'
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      # MSVC environment for Ninja generator (must precede cmake). This runs
      # vcvars64.bat and exports what it sets or changes, as ilammy/msvc-dev-cmd did; that
      # action's latest release (v1.13.0) still declares node20, which the runners deprecate.
      - name: Set up MSVC dev environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no Visual Studio with the x64 C++ tools" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $vars = cmd /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]; $value = $matches[2]
              if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              }
            }
          }

      # the Ninja generator invokes cl.exe through sccache, whose server the cache step
      # above started over its local directory
      - name: Set sccache compiler launcher
        if: runner.os == 'Windows'
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake -B build
          ${{ matrix.cmake_generator && format('-G {0}', matrix.cmake_generator) || '' }}
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.CMAKE_C_COMPILER_LAUNCHER || '' }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.CMAKE_CXX_COMPILER_LAUNCHER || '' }}
          ${{ matrix.cmake_flags }}
          ${{ matrix.toolchain && format('-DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/{0}', matrix.toolchain) || '' }}
          ${{ matrix.cc && format('-DCMAKE_C_COMPILER={0}', matrix.cc) || '' }}
          ${{ matrix.cxx && format('-DCMAKE_CXX_COMPILER={0}', matrix.cxx) || '' }}

      # One compile per vCPU: the hosted runners have 4 (3 on arm64 macOS, set in the
      # matrix). --parallel 2 dated from the 2-vCPU runners and halved every cold build.
      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} --parallel ${{ matrix.build_jobs || 4 }}

      # Keep one ccache generation per artifact. ccache-action saves a NEW timestamped key
      # in its post step, and until the Prune workflow runs the old and new generations of
      # every artifact coexist. That doubling took the cache past its budget mid-run, so
      # the jobs that finish late -- the slow ones -- failed to save and stayed cold.
      # Deleting the generation this job restored lets the save replace it instead.
      - name: Drop the superseded ccache generation
        if: github.ref == 'refs/heads/main'
        shell: bash   # Git's bash on Windows, not WSL's
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/scripts/ci-drop-ccache-generation.sh ${{ matrix.artifact }}

      # Wine makes its prefix and starts its server on first use. Under ctest -j 4 the
      # first tests then race to create the server's directory and lose with "wine: chdir
      # to /tmp/wine-.../server-...: No such file or directory" (#1838). So make the prefix,
      # start one persistent server, and start Wine's services under it now. The last
      # wineboot matters: services a TEST starts inherit that test's stdout, the persistent
      # server keeps them alive, and ctest waits for that pipe forever.
      #
      # The container runs as root, but Actions mounts HOME (/github/home) owned by the
      # runner's user, and Wine will not make a prefix in a directory it does not own. So
      # the prefix goes under root's own home, for this step and the tests.
      - name: Start Wine
        if: matrix.cross == 'mingw'
        run: |
          export WINEPREFIX=/root/.wine
          echo "WINEPREFIX=$WINEPREFIX" >> "$GITHUB_ENV"
          wineboot --init && wineserver -w
          wineserver -p
          wineboot </dev/null >/dev/null 2>&1

      - name: Test
        if: matrix.cross != 'android'
        working-directory: build
        run: ctest -j 4 -C ${{env.BUILD_TYPE}} --output-on-failure

      - name: Rerun failed tests
        if: failure() && matrix.cross != 'android'
        run: |
          cd build
          ctest -C ${{env.BUILD_TYPE}} --rerun-failed --output-on-failure

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.artifact }}
          path: |
            build/Testing
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
