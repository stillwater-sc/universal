<svg xmlns="http://www.w3.org/2000/svg" width="960" height="498" viewBox="0 0 960 498" font-family="Helvetica, Arial, sans-serif">
<title>The tiles of poxel&lt;5,0&gt; covering the non-negative real line</title>
