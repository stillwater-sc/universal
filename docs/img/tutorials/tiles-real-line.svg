<text x="24" y="34" font-size="17" font-weight="bold" fill="#1a1a1a">1. Tiles cover the real line: exact points, and the open intervals between them</text>
<text x="24" y="54" font-size="13" fill="#555555">poxel&lt;5,0&gt;, the non-negative half. Each tile is one encoding, the posit bits then the ubit; spaced by encoding, not to scale.</text>
